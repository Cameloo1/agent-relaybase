name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows Credential Modules
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build x64 and ARM64 DPAPI modules
        run: npm run native:build:all

      - name: Upload Windows credential modules
        uses: actions/upload-artifact@v4
        with:
          name: relaybase-windows-native-${{ github.run_id }}
          path: dist-runtime/native/relaybase_windows-win32-*.node
          if-no-files-found: error
          retention-days: 1

  node:
    name: Node Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release verification gate
        run: npm run verify

      - name: Verify clean workspace
        if: always()
        run: npm run verify:clean-worktree

  go-tui:
    name: Go TUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Print Go environment
        working-directory: tui
        run: |
          go version
          go env GOVERSION GOOS GOARCH GOMOD GOMODCACHE

      - name: Run Go tests
        run: npm run tui:test

      - name: Run Go vet
        run: npm run tui:vet

      - name: Run Go race tests
        if: runner.os == 'Linux'
        run: npm run tui:race

      - name: Verify clean workspace
        if: always()
        run: npm run verify:clean-worktree

  tui-build:
    name: TUI Build Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Print Go environment
        working-directory: tui
        run: |
          go version
          go env GOVERSION GOOS GOARCH GOMOD GOMODCACHE

      - name: Install dependencies
        run: npm ci

      - name: Build platform TUI binary
        run: npm run tui:build

      - name: Execute installed package candidate
        run: |
          npm run package:prepare-platforms:current
          npm run package:install-smoke

      - name: Verify clean workspace
        if: always()
        run: npm run verify:clean-worktree

  package:
    name: Package Check
    needs:
      - node
      - go-tui
      - tui-build
      - windows-native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Download Windows credential modules
        uses: actions/download-artifact@v4
        with:
          name: relaybase-windows-native-${{ github.run_id }}
          path: dist-runtime/native

      - name: Build all platform TUI binaries
        run: npm run tui:build:all

      - name: Prepare platform packages
        run: npm run package:prepare-platforms

      - name: Verify package contents
        run: |
          npm run package:check:strict
          npm run package:check-platforms

      - name: Verify disposable install
        run: npm run package:install-smoke

      - name: Verify clean workspace
        if: always()
        run: npm run verify:clean-worktree

  release-artifacts:
    name: Release Artifact Dry Run
    needs:
      - go-tui
      - tui-build
      - windows-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Print Go environment
        working-directory: tui
        run: |
          go version
          go env GOVERSION GOOS GOARCH GOMOD GOMODCACHE

      - name: Install dependencies
        run: npm ci

      - name: Download Windows credential modules
        uses: actions/download-artifact@v4
        with:
          name: relaybase-windows-native-${{ github.run_id }}
          path: dist-runtime/native

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Print GoReleaser version
        run: goreleaser --version

      - name: Validate GoReleaser configuration
        run: npm run release:check

      - name: Generate snapshot release artifacts and checksums
        run: npm run release:dry-run

      - name: Inspect release artifacts
        run: |
          test -f dist/relaybase-tui-checksums.txt
          cat dist/relaybase-tui-checksums.txt
          find dist -maxdepth 2 -type f | sort

      - name: Verify clean workspace
        if: always()
        run: npm run verify:clean-worktree

      - name: Upload release dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relaybase-tui-release-dry-run
          path: dist/**
          if-no-files-found: error
